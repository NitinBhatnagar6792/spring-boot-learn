server.port = 9090
logging.level.org.springframework=info
#spring.profiles.active=prod
#spring.profiles.active=dev

management.endpoints.web.exposure.include=health,metrics

course-service.maxCourses = 2
course-service.defaultLanguage=English


# ===============================
# MYSQl DATABASE CONFIG WITH DOCKER
# ===============================
spring.jpa.hibernate.ddl-auto=update
spring.datasource.url=jdbc:mysql://localhost:3306/spring-boot-learn?useSSL=false&serverTimezone=UTC
spring.datasource.username=springboot-user
spring.datasource.password=dummyboot
#spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.MySQL57Dialect
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver

# Show SQL in console
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true
	
# ===============================
# OPTIONAL (GOOD FOR DEBUGGING)
# ===============================
logging.level.org.hibernate.SQL=DEBUG
logging.level.org.hibernate.type.descriptor.sql.BasicBinder=TRACE



