# ===============================
# MYSQl DATABASE CONFIG WITH DOCKER
# ===============================
spring.datasource.hikari.initializationFailTimeout=60000
spring.jpa.hibernate.ddl-auto=update

# use below if running the spring boot application from eclipse and hosting mysql in docker
# make sure to start mysql image in docker
spring.datasource.url=jdbc:mysql://localhost:3306/spring-boot-learn?useSSL=false&serverTimezone=UTC

# use below if this application is build as a docker image and mysql is also hosted on docker 
#spring.datasource.url=jdbc:mysql://mysql:3306/spring-boot-learn?useSSL=false&serverTimezone=UTC

spring.datasource.username=springboot-user
spring.datasource.password=dummyboot
#spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.MySQL57Dialect
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver
spring.sql.init.mode=never

